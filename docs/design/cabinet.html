<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professor's Tutor — Account</title>
<style>/* ============================================================
   KSE BUSINESS SCHOOL — Professor's Tutor
   Дизайн-токени з брендбука (жовтень 2026).

   Кольори     — палітра презентаційного брендбука
   Гарнітура   — Arial. Жодних вебшрифтів
   Радіуси     — 0. Бренд квадратний, і це його головна ознака
   Тіні        — немає. Площини розділяються лініями в 1px
   Елементи    — плашки: суцільні прямокутники, що стикуються
                 впритул і заходять одна на одну. Плюс крапковий
                 растр як тло. Це мова слайдів, перенесена в UI
   Критичне    — #62005F (вторинний колір бренда), бо червоного
                 в палітрі не існує

   Дві теми, один набір змінних:
     світла — біла шапка, зелений логотип
     темна  — майже чорна шапка (#111112 з брендбука), логотип білий
   ============================================================ */
:root{
  /* бренд */
  --brand:#004641;
  --brand-deep:#003632;
  --mint:#94D4C1;
  --green:#2EC195;
  --green-2:#60BE98;
  --plum:#62005F;

  /* шапка */
  --bar:#FFFFFF;
  --bar-fg:#111112;
  --bar-fg-2:#6B7280;
  --bar-line:rgba(17,17,18,.14);
  --bar-hover:#EDEFEE;
  --logo:#004641;

  /* площини */
  --bg:#EDEFEE;
  --paper:#FFFFFF;
  --soft:#E4E8E6;
  --band:#DFE8E4;
  --ink:#111112;
  --ink-2:#4B5554;
  --ink-3:#6B7280;
  --line:rgba(17,17,18,.13);
  --rule:#D2D8D6;
  --dot:rgba(0,70,65,.34);

  /* плашки */
  --plate:#94D4C1;
  --plate-fg:#06302A;

  /* ролі */
  --btn-bg:var(--brand); --btn-fg:#FFFFFF; --btn-hover:var(--brand-deep);
  --ok:var(--brand);
  --wip:var(--green-2);
  --flag:var(--plum);
  --flag-soft:rgba(98,0,95,.07);
  --ins:rgba(46,193,149,.32);
  --ins-0:rgba(46,193,149,.66);
  --me:var(--brand); --me-fg:#FFFFFF;

  /* геометрія */
  --r:0;
  --sh:inset 0 0 0 1px var(--line);
  --font:Arial,'Helvetica Neue',Helvetica,'Liberation Sans',sans-serif;
  --w-side:248px; --w-doc:560px; --w-doc-min:512px;
}

:root[data-theme="dark"]{
  --bar:#111112;
  --bar-fg:#FFFFFF;
  --bar-fg-2:rgba(255,255,255,.58);
  --bar-line:rgba(255,255,255,.14);
  --bar-hover:rgba(255,255,255,.1);
  --logo:#FFFFFF;

  --bg:#0B0B0C;
  --paper:#161618;
  --soft:#222225;
  --band:#13211E;
  --ink:#FFFFFF;
  --ink-2:#B6C1BE;
  --ink-3:rgba(255,255,255,.52);
  --line:rgba(255,255,255,.15);
  --rule:#000000;
  --dot:rgba(148,212,193,.32);

  --plate:#2EC195;
  --plate-fg:#06302A;

  --btn-bg:var(--green); --btn-fg:#06302A; --btn-hover:var(--green-2);
  --ok:var(--green);
  --wip:var(--mint);
  --flag:#D79BD4;                 /* освітлений #62005F: оригінал на
                                     темному не читається */
  --flag-soft:rgba(215,155,212,.1);
  --ins:rgba(46,193,149,.26);
  --ins-0:rgba(46,193,149,.5);
  --me:var(--brand); --me-fg:#FFFFFF;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ============ плашка ============================================
   Базовий елемент усієї системи. Прямокутник із заливкою, без
   радіуса. Дві плашки, поставлені впритул, — підпис і значення.
   ============================================================== */
.plate{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:5px 12px;font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
.plate-w{background:var(--paper);color:var(--ink);box-shadow:var(--sh);
  letter-spacing:0;text-transform:none}
.plates{display:flex;align-items:stretch}

/* крапковий растр — тло, не декор заради декору */
.raster{background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px}

/* ============ шапка ============================================
   Світла тема: біла, логотип зелений. Темна: майже чорна, логотип
   білий. Колір логотипа — currentColor, тому SVG один на обидві.
   ============================================================== */
.header{flex:0 0 auto;height:64px;display:flex;align-items:center;gap:22px;
  padding:0 18px;background:var(--bar);color:var(--bar-fg);
  border-bottom:1px solid var(--bar-line)}
.logo{flex:0 0 auto;display:block;width:182px;height:34px;color:var(--logo)}
.logo svg{display:block;width:182px;height:34px}
.hdots{flex:0 0 96px;height:24px;align-self:center;
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:9px 9px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 55%,transparent);opacity:.75}

.tabs{display:flex;gap:0;flex:1;min-width:0;overflow:hidden;align-items:center}
.tab{height:34px;padding:0 15px;border-radius:var(--r);font-size:13px;
  color:var(--bar-fg-2);display:flex;align-items:center;gap:9px;
  white-space:nowrap;transition:.13s}
.tab:hover{background:var(--bar-hover);color:var(--bar-fg)}
.tab.on{background:var(--plate);color:var(--plate-fg);font-weight:700}
.tdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.tdot.wip{background:var(--green)}
.tdot.ok{background:var(--brand)}
.tdot.new{background:var(--line)}
.tab.on .tdot{background:var(--plate-fg)}
.tab-add{height:34px;padding:0 13px;border-radius:var(--r);
  color:var(--bar-fg-2);font-size:13px}
.tab-add:hover{background:var(--bar-hover);color:var(--bar-fg)}

.who{flex:0 0 auto;display:flex;align-items:center;gap:0}
.who-name{font-size:13px;color:var(--bar-fg-2);padding-right:14px}
.who-av{width:34px;height:34px;border-radius:var(--r);background:var(--brand);
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
:root[data-theme="dark"] .who-av{background:var(--green);color:#06302A}
.theme{width:34px;height:34px;margin-left:10px;border-radius:var(--r);
  display:grid;place-items:center;font-size:14px;color:var(--bar-fg-2);
  box-shadow:inset 0 0 0 1px var(--bar-line)}
.theme:hover{background:var(--bar-hover);color:var(--bar-fg)}

/* ============ кнопки — ті самі плашки ========================== */
.btn{height:36px;padding:0 18px;border-radius:var(--r);font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:.13s;white-space:nowrap}
.btn-fill{background:var(--btn-bg);color:var(--btn-fg)}
.btn-fill:hover{background:var(--btn-hover)}
.btn-soft{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-3)}
.btn-soft:hover{background:var(--soft)}
.btn-ghost{color:var(--ink-2);font-weight:400}
.btn-ghost:hover{background:var(--soft)}
.btn:disabled{opacity:.32;cursor:default}
.btn-s{height:32px;padding:0 15px;font-size:12.5px}
.btn-w{width:100%}
.btn-lg{height:46px;padding:0 26px;font-size:14px}

/* ============ каркас ============================================ */
.body{flex:1;display:flex;gap:1px;background:var(--rule);min-height:0}
.card{background:var(--paper);display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* ---- зона 1 : структура силабуса ---- */
.side{width:var(--w-side);flex:0 0 var(--w-side);padding:0}
.side-list{flex:1;overflow-y:auto;padding:12px 0}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-radius:var(--r);text-align:left;transition:.13s;
  box-shadow:inset 3px 0 0 transparent}
.item:hover{background:var(--soft)}
.item.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--plate)}
.dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--ok)}
.dot.need{background:var(--flag)}
.dot.draft{background:var(--wip)}
.nm{flex:1;font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.item.on .nm{color:var(--ink);font-weight:700}

.side-foot{position:relative;flex:0 0 auto;padding:18px 16px 16px;
  border-top:1px solid var(--line);isolation:isolate}
.side-foot:before{content:'';position:absolute;inset:0;z-index:-1;
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 72%);
  mask-image:linear-gradient(180deg,#000,transparent 72%);opacity:.55}
.rd-top{display:flex;align-items:stretch;margin-bottom:10px}
.rd-l{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:5px 11px;font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase}
.rd-v{display:inline-flex;align-items:center;padding:5px 12px;font-size:15px;
  font-weight:700;box-shadow:var(--sh)}
.bar{height:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--btn-bg);width:0;
  transition:width .5s cubic-bezier(.32,.72,0,1)}
.rd-sub{font-size:12px;color:var(--ink-3);margin:10px 0 14px}

/* ---- зона 2 : чат ---- */
.chat{flex:1;min-width:400px;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;padding:30px 24px 4px}
.thread{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.turn{display:flex;flex-direction:column;gap:14px}
.turn.me{align-items:flex-end}
.said{font-size:14.5px;line-height:1.6;max-width:94%}
.said p+p{margin-top:12px}
.said b{font-weight:700}
.turn.me .said{background:var(--me);color:var(--me-fg);padding:11px 16px;
  font-size:14px;max-width:80%}
.quiet{color:var(--ink-2);font-size:13.5px}
.panel{background:var(--paper);box-shadow:var(--sh);padding:20px}
.p-lead{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.p-lead b{color:var(--ink);font-weight:700}

.opt{width:100%;display:flex;gap:12px;align-items:flex-start;padding:14px;
  border-radius:var(--r);text-align:left;transition:.13s;
  box-shadow:inset 0 0 0 1px transparent}
.opt:hover{background:var(--soft)}
.opt.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-theme="dark"] .opt.on{box-shadow:inset 0 0 0 2px var(--green)}
.ring{flex:0 0 auto;width:14px;height:14px;margin-top:4px;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px var(--ink-3)}   /* кругле навмисно:
     квадратна рамка читається як чекбокс, а вибір тут один */
.opt.on .ring{box-shadow:inset 0 0 0 5px var(--brand)}
:root[data-theme="dark"] .opt.on .ring{box-shadow:inset 0 0 0 5px var(--green)}
.o-t{display:block;font-size:13.5px;font-weight:700}
.o-q{display:block;font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:5px}
.o-note{display:inline-flex;align-items:center;margin-top:8px;background:var(--plate);
  color:var(--plate-fg);padding:3px 10px;font-size:11px;font-weight:700;
  letter-spacing:.06em}
.was{font-size:13.5px;color:var(--ink-3);text-decoration:line-through;
  text-decoration-color:var(--line);margin-bottom:10px}
.now{font-size:13.5px;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}
.why{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:14px}
.val{background:var(--ins);padding:1px 5px;font-weight:700;color:var(--ink)}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:.9}}

/* ---- порожній стан ---- */
.empty{position:relative;max-width:540px;margin:7vh auto 0;text-align:center;isolation:isolate}
.empty:before{content:'';position:absolute;z-index:-1;left:50%;top:-34px;
  width:420px;height:150px;transform:translateX(-50%);
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px;
  -webkit-mask-image:radial-gradient(60% 60% at 50% 42%,#000,transparent);
  mask-image:radial-gradient(60% 60% at 50% 42%,#000,transparent);opacity:.75}
.empty h2{font-size:28px;font-weight:400;letter-spacing:-.015em;margin-bottom:10px;line-height:1.2}
.empty p{color:var(--ink-2);font-size:14.5px;margin-bottom:28px}
.drop{background:var(--paper);box-shadow:var(--sh);padding:34px 26px;
  transition:.13s;cursor:pointer}
.drop:hover{box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-theme="dark"] .drop:hover{box-shadow:inset 0 0 0 2px var(--green)}
.drop-i{font-size:24px;margin-bottom:10px;opacity:.45}
.drop-t{font-size:14.5px;font-weight:700}
.drop-s{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.orr{display:flex;align-items:center;gap:14px;margin:20px 0;color:var(--ink-3);font-size:12px}
.orr:before,.orr:after{content:"";height:1px;background:var(--line);flex:1}
.howto{margin-top:28px;font-size:12.5px;color:var(--ink-3)}

/* ---- поле вводу ---- */
.compose{flex:0 0 auto;padding:14px 24px 10px}
.compose-in{max-width:620px;margin:0 auto;display:flex;gap:0;align-items:center;
  background:var(--paper);padding:0 0 0 18px;box-shadow:var(--sh);transition:.13s}
.compose-in.hot{box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-theme="dark"] .compose-in.hot{box-shadow:inset 0 0 0 2px var(--green)}
.compose-in input{flex:1;border:none;outline:none;font-size:14px;background:none;
  height:44px;color:var(--ink)}
.compose-in input::placeholder{color:var(--ink-3)}
.send{width:44px;height:44px;border-radius:var(--r);background:var(--btn-bg);
  color:var(--btn-fg);display:grid;place-items:center;flex:0 0 auto;font-size:15px}
.foot-hint{position:relative;max-width:620px;margin:10px auto 0;font-size:11.5px;
  color:var(--ink-3);text-align:center;isolation:isolate}
.foot-hint:before{content:'';position:absolute;z-index:-1;left:50%;top:-6px;
  width:300px;height:34px;transform:translateX(-50%);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);
  background-size:9px 9px;
  -webkit-mask-image:radial-gradient(60% 70% at 50% 50%,#000,transparent);
  mask-image:radial-gradient(60% 70% at 50% 50%,#000,transparent);opacity:.5}

/* ---- зона 3 : живий документ ---- */
.doc{width:var(--w-doc);flex:0 0 var(--w-doc);min-width:var(--w-doc-min)}
.doc-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 16px;height:50px;border-bottom:1px solid var(--line)}
.doc-lbl{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:5px 12px;font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase}
.doc-bar .seg{margin-left:auto}
.seg{display:flex;box-shadow:var(--sh)}
.seg button{padding:7px 15px;border-radius:var(--r);font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--plate);color:var(--plate-fg);font-weight:700}
.icob{width:34px;height:34px;border-radius:var(--r);color:var(--ink-2);
  display:grid;place-items:center;font-size:15px;box-shadow:var(--sh)}
.icob:hover{background:var(--soft)}
.paper{flex:1;overflow-y:auto;padding:0 34px 60px}
.doc-empty{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;color:var(--ink-3);gap:10px;padding:0 40px}
.doc-empty .big{font-size:28px;opacity:.3}

/* шапка документа: растрова смуга, на її нижній край сідають дві
   плашки впритул — підпис і назва. Пряма цитата зі слайдів */
.d-head{position:relative;height:92px;margin:0 -34px 40px;background:var(--band);
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px}
.d-plates{position:absolute;left:34px;bottom:-18px;display:flex;align-items:stretch;max-width:calc(100% - 68px)}
.d-kicker{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:10px 15px;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase}
.d-title{display:inline-flex;align-items:center;background:var(--paper);
  color:var(--ink);padding:10px 18px;font-size:18px;font-weight:700;
  letter-spacing:-.01em;box-shadow:var(--sh);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.d-sep{display:none}

.sec{scroll-margin-top:12px;padding:10px 12px;margin:0 -12px 12px;transition:background .45s}
.sec.flash{background:var(--soft)}
.h{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-2);
  margin-bottom:14px;letter-spacing:.11em;text-transform:uppercase;
  padding-bottom:6px;border-bottom:3px solid var(--plate)}
.p{font-size:13.5px;line-height:1.65;margin-bottom:10px}
.p.small{font-size:12.5px;color:var(--ink-2)}
.sub{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:18px 0 7px}
.ul{margin:0 0 8px 18px}
.ul li{font-size:13px;line-height:1.65;margin-bottom:2px}
.blank{display:block;padding:12px 14px;background:var(--soft);font-size:12.5px;color:var(--ink-3)}
.blank.need{background:var(--flag-soft);color:var(--flag);box-shadow:inset 3px 0 0 var(--flag)}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{text-align:left;font-weight:700;color:var(--ink-3);font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;padding:0 10px 8px 0}
table td{padding:9px 10px 9px 0;vertical-align:top;line-height:1.5;border-top:1px solid var(--line)}
table tr:first-child td{border-top:none}
.kv td:first-child{color:var(--ink-2);width:44%;font-size:12.5px}
.miss{color:var(--flag);font-weight:700}
.new{background:var(--ins);padding:1px 4px;animation:in .6s}
@keyframes in{from{background:var(--ins-0)}}
.tot{font-weight:700}
.bad{color:var(--flag)}

/* ---- фінальний екран ----
   Клас навмисно НЕ .done: .dot.done у лівій панелі має той самий
   суфікс, і правило ловило б статусні крапки. */
.finish{position:absolute;inset:0;background:var(--bg);opacity:.97;
  display:grid;place-items:center;z-index:40;padding:30px}
.finish-c{background:var(--paper);box-shadow:var(--sh);padding:40px;max-width:520px;text-align:center}
.finish-c h2{font-size:24px;font-weight:400;margin:16px 0 10px}
.finish-c p{color:var(--ink-2);font-size:14px}
.tick{width:52px;height:52px;background:var(--plate);color:var(--plate-fg);
  display:grid;place-items:center;font-size:24px;margin:0 auto}
.recv{text-align:left;margin:22px 0 4px;display:flex;flex-direction:column}
.recv div{font-size:13px;color:var(--ink-2);padding:9px 0;border-top:1px solid var(--line)}
.recv div b{color:var(--ink);font-weight:700}

/* ---- сповіщення ---- */
.toast{position:fixed;right:22px;bottom:78px;z-index:70;background:var(--brand);color:#fff;
  padding:0;display:flex;align-items:stretch;max-width:360px;
  opacity:0;transform:translateY(10px);transition:.26s cubic-bezier(.32,.72,0,1)}
.toast.in{opacity:1;transform:none}
.toast .ti{width:46px;background:var(--plate);color:var(--plate-fg);
  display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.toast>span:last-child{padding:12px 16px}
.toast b{display:block;font-size:13.5px;font-weight:700}
.toast i{display:block;font-style:normal;font-size:12px;color:var(--mint);margin-top:2px}

/* ---- службова панель прототипу, у проді не існує ---- */
.demo{position:fixed;right:22px;bottom:22px;z-index:60;
  background:#111112;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);padding:7px 8px 7px 16px;
  display:flex;align-items:center;gap:14px;font-size:12.5px}
.demo b{font-weight:700;color:rgba(255,255,255,.55)}
.demo button{background:rgba(255,255,255,.16);padding:6px 13px;font-size:12px;color:#fff}
.demo button:hover{background:rgba(255,255,255,.3)}

@media(max-width:1300px){:root{--w-doc:512px;--w-side:224px}.who-name,.hdots{display:none}}

/* ============================================================
   Кабінети — надбудова над kse.css.
   Ті самі токени, той самий словник плашок. Нічого власного,
   крім матриці покриття.
   ============================================================ */

/* ---- ліва навігація ---- */
.nav{padding:14px 0}
.nav-h{display:block;padding:0 16px 8px;font-size:10.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.nav-i{width:100%;display:flex;align-items:center;gap:10px;padding:10px 16px;
  text-align:left;font-size:13px;color:var(--ink-2);transition:.13s;
  box-shadow:inset 3px 0 0 transparent}
.nav-i:hover{background:var(--soft)}
.nav-i.on{background:var(--soft);color:var(--ink);font-weight:700;
  box-shadow:inset 3px 0 0 var(--plate)}
.nav-i .n{flex:1}
.nav-i .c{font-size:11px;color:var(--ink-3);font-weight:400}
.nav-sep{height:1px;background:var(--line);margin:12px 0}
.nav-i:disabled{opacity:.42;cursor:default}
.nav-i:disabled:hover{background:none}

/* ---- центральна колонка ---- */
.wrap{flex:1;min-width:0;background:var(--paper)}
.wrap-s{flex:1;overflow-y:auto}
.hero{position:relative;height:108px;background:var(--band);
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px}
.hero-p{position:absolute;left:28px;bottom:-18px;display:flex;align-items:stretch;
  max-width:calc(100% - 56px)}
.hero-k{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:10px 15px;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.hero-t{display:inline-flex;align-items:center;background:var(--paper);color:var(--ink);
  padding:10px 18px;font-size:18px;font-weight:700;letter-spacing:-.01em;
  box-shadow:var(--sh);white-space:nowrap}
.wrap-in{padding:42px 28px 56px}

/* ---- показники: пари плашок ---- */
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
.stat{display:flex;align-items:stretch}
.stat .k{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:7px 11px;font-size:10.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.stat .v{display:inline-flex;align-items:center;padding:7px 13px;font-size:15px;
  font-weight:700;box-shadow:var(--sh);white-space:nowrap}
.stat.bad .k{background:var(--flag);color:#fff}
:root[data-theme="dark"] .stat.bad .k{color:#111112}
.stat.bad .v{color:var(--flag)}

.sec-h{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-2);
  letter-spacing:.11em;text-transform:uppercase;padding-bottom:6px;
  border-bottom:3px solid var(--plate);margin:0 0 16px}
.sec-note{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin:0 0 18px;max-width:72ch}
.block{margin-bottom:44px}

/* ---- матриця покриття ---- */
.mx-scroll{overflow-x:auto;padding-bottom:4px}
.mx{border-collapse:collapse;font-size:12px;table-layout:fixed}
.mx th,.mx td{border:1px solid var(--line)}
.mx thead th{background:var(--soft);font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);
  padding:8px 6px;text-align:center;white-space:nowrap}
.mx thead th.rowh{text-align:left;padding-left:12px}
.mx tbody th{text-align:left;font-weight:400;font-size:12px;color:var(--ink-2);
  padding:7px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:none}
.mx tbody th b{font-weight:700;color:var(--ink);margin-right:7px}
.mx tbody tr:hover th,.mx tbody tr:hover td{background:var(--soft)}
.mx tr.bad th{color:var(--flag)}
.mx tr.bad th b{color:var(--flag)}
.mx td.c{width:36px;height:34px;padding:0;text-align:center;cursor:pointer}
.mx td.c span{display:block;width:100%;height:100%}
.c-full span{background:var(--plate)}
.c-part span{background:var(--plate);
  -webkit-mask-image:repeating-linear-gradient(135deg,#000 0 4px,transparent 4px 8px);
  mask-image:repeating-linear-gradient(135deg,#000 0 4px,transparent 4px 8px)}
.mx td.c.on span{box-shadow:inset 0 0 0 2px var(--ink)}
.mx td.sum{width:46px;text-align:center;font-weight:700;font-size:12px;color:var(--ink-2)}
.mx tr.bad td.sum{color:var(--flag)}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--ink-3)}
.key{display:inline-flex;align-items:center;gap:8px}
.sw{width:15px;height:15px;display:inline-block;box-shadow:inset 0 0 0 1px var(--line)}
.sw.full{background:var(--plate)}
.sw.part{background:var(--plate);
  -webkit-mask-image:repeating-linear-gradient(135deg,#000 0 4px,transparent 4px 8px);
  mask-image:repeating-linear-gradient(135deg,#000 0 4px,transparent 4px 8px)}

/* ---- таблиця курсів ---- */
.tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.tbl th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);padding:0 12px 10px 0}
.tbl td{padding:12px 12px 12px 0;border-top:1px solid var(--line);
  vertical-align:middle;overflow:hidden}
.tbl tr:hover td{background:var(--soft)}
.tbl .nm{font-weight:700;white-space:normal;line-height:1.35}
.tbl .sub{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:2px}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--plate);
  color:var(--plate-fg);padding:3px 7px;font-size:10.5px;font-weight:700;white-space:nowrap}
.chip i{font-style:normal;font-weight:400;opacity:.75}
.chip.el{background:var(--soft);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.st{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.st .d{width:7px;height:7px;border-radius:50%;background:var(--line)}
.st.ok .d{background:var(--ok)} .st.wip .d{background:var(--wip)} .st.no .d{background:var(--flag)}
.st.no{color:var(--flag);font-weight:700}
.minibar{width:68px;height:6px;background:var(--soft);display:inline-block;vertical-align:middle}
.minibar i{display:block;height:100%;background:var(--btn-bg)}
.rt{text-align:right}

/* ---- права панель ---- */
.drawer{width:340px;flex:0 0 340px;min-width:340px}
.dr-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;
  height:50px;border-bottom:1px solid var(--line)}
.dr-lbl{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:5px 12px;font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase}
.dr-x{margin-left:auto;width:32px;height:32px;display:grid;place-items:center;
  color:var(--ink-3);box-shadow:var(--sh)}
.dr-x:hover{background:var(--soft)}
.dr-s{flex:1;overflow-y:auto;padding:22px 20px 40px}
.dr-empty{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;color:var(--ink-3);gap:10px;padding:0 30px;font-size:13px}
.dr-h{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px}
.dr-sub{font-size:12px;color:var(--ink-3);margin-bottom:18px}
.dr-f{padding:14px 0;border-top:1px solid var(--line)}
.dr-f .l{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:6px}
.dr-f .t{font-size:13px;line-height:1.6}
.pick{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;
  text-align:left;transition:.13s;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
.pick:hover{background:var(--soft)}
.pick.on{box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-theme="dark"] .pick.on{box-shadow:inset 0 0 0 2px var(--green)}
.pick .bx{width:15px;height:15px;flex:0 0 auto;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.pick.on .bx{background:var(--plate);box-shadow:inset 0 0 0 1.5px var(--plate)}
.pick .pn{flex:1;font-size:13px}
.pick .pt{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.pick:disabled{opacity:.42;cursor:default}
.pick:disabled:hover{background:none}

/* ---- список зауважень ---- */
.iss{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.iss .sev{flex:0 0 auto;display:inline-flex;align-items:center;background:var(--flag);
  color:#fff;padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase}
:root[data-theme="dark"] .iss .sev{color:#111112}
.iss .sev.w{background:var(--soft);color:var(--ink-2)}
:root[data-theme="dark"] .iss .sev.w{color:var(--ink-2)}
.iss .tx{flex:1;font-size:13px;line-height:1.55}
.iss .tx b{font-weight:700}
.iss .tx span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}

@media(max-width:1340px){.drawer{width:300px;flex:0 0 300px;min-width:300px}}

/* ============================================================
   Єдиний кабінет: профіль, вкладки, ролі
   ============================================================ */

/* ---- меню під аватаром ---- */
.avwrap{position:relative;display:flex;align-items:center}
.menu{position:absolute;right:0;top:44px;z-index:80;width:264px;background:var(--paper);
  box-shadow:var(--sh),0 18px 40px -18px rgba(0,0,0,.45);display:none}
.menu.on{display:block}
.menu-top{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.menu-av{width:40px;height:40px;background:var(--brand);color:#fff;display:grid;
  place-items:center;font-size:13px;font-weight:700;flex:0 0 auto}
:root[data-theme="dark"] .menu-av{background:var(--green);color:#06302A}
.menu-nm{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.menu-rl{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.menu-i{width:100%;display:flex;align-items:center;gap:10px;padding:11px 16px;
  text-align:left;font-size:13px;color:var(--ink-2)}
.menu-i:hover{background:var(--soft);color:var(--ink)}
.menu-i .c{margin-left:auto;font-size:11px;color:var(--ink-3)}
.menu-sep{height:1px;background:var(--line)}

/* ---- перемикач програми в контенті ---- */
.progsel{display:flex;align-items:stretch;margin-bottom:26px}
.progsel .l{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:7px 12px;font-size:10.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase}
.progsel button{padding:7px 15px;font-size:12.5px;color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--line)}
.progsel button.on{background:var(--ink);color:var(--paper);font-weight:700;
  box-shadow:inset 0 0 0 1px var(--ink)}
.progsel button:disabled{opacity:.4;cursor:default}

/* ---- картки власних силабусів ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px}
.card-s{background:var(--paper);box-shadow:var(--sh);padding:16px;display:flex;
  flex-direction:column;gap:10px;cursor:pointer;transition:.13s}
.card-s:hover{box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-theme="dark"] .card-s:hover{box-shadow:inset 0 0 0 2px var(--green)}
.card-s .t{display:block;font-size:14px;font-weight:700;line-height:1.3}
.card-s .m{display:block;font-size:11.5px;color:var(--ink-3)}
.card-s .b{margin-top:auto}
.card-new{background:none;box-shadow:inset 0 0 0 1.5px var(--line);align-items:center;
  justify-content:center;text-align:center;color:var(--ink-3);font-size:13px;min-height:132px}
.card-new:hover{box-shadow:inset 0 0 0 2px var(--brand);color:var(--ink)}

/* ---- профіль ---- */
.prof{display:flex;gap:26px;align-items:flex-start;margin-bottom:30px}
.prof-av{width:92px;height:92px;flex:0 0 auto;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:28px;font-weight:700}
:root[data-theme="dark"] .prof-av{background:var(--green);color:#06302A}
.prof-n{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.prof-r{display:block;font-size:13px;color:var(--ink-2);margin-top:4px}
.prof-m{display:block;font-size:12.5px;color:var(--ink-3);margin-top:8px}
.fld{display:flex;gap:18px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.fld .l{flex:0 0 190px;font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.fld .v{flex:1;font-size:13.5px;line-height:1.6}
.fld .v ul{margin:0 0 0 17px}
.fld .v li{margin-bottom:3px}
.src{display:inline-flex;align-items:center;background:var(--soft);color:var(--ink-2);
  padding:2px 8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;margin-left:8px}

/* ---- довідник політик ---- */
.pol{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.pol .n{flex:0 0 26px;font-size:12px;font-weight:700;color:var(--ink-3);padding-top:2px}
.pol .b{flex:1}
.pol .t{display:block;font-size:13.5px;font-weight:700}
.pol .d{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.pol .m{flex:0 0 auto}

/* ---- службова панель із ролями ---- */
.demo .rsw{display:flex;gap:0}
.demo .rsw button{background:rgba(255,255,255,.12);padding:6px 12px;font-size:12px}
.demo .rsw button.on{background:var(--green);color:#06302A;font-weight:700}
</style>
</head>

function toggleMenu(e){ e.stopPropagation(); menuOpen = !menuOpen; $('menu').classList.toggle('on', menuOpen) }
document.addEventListener('click', () => { if(menuOpen){ menuOpen=false; $('menu').classList.remove('on') } });
function clearSel(){ sel = null; draw() }

/* ---------- один перемикач набору, у контенті ---------- */
function progsel(){
  return `<div class="progsel"><span class="l">Cohort</span>`
    + Object.keys(D).map(p => `<button class="${p===prog?'on':''}" onclick="setProg('${p}')">${p}</button>`).join('')
    + `<button disabled>MMM28</button><button disabled>EMBA28</button></div>`;
}
function setProg(p){ prog = p; sel = null; draw() }

/* ---------- екрани ---------- */
function vMine(){
  const mine = SYL.filter(s => s.own === role);
  return `<div class="block">
    <div class="sec-h">My syllabi</div>
    <p class="sec-note">Everyone works on syllabi the same way. The Academic Director teaches
      courses too, so this screen is identical to the instructor's.</p>
    <div class="cards">`
    + mine.map(s => `<div class="card-s" onclick="pickSyl('${esc(s.c)}','${s.p}')">
        <span class="t">${esc(s.c)}</span>
        <span class="m">${s.p} · ${SRC[s.src]}</span>
        <span class="b"><span class="st ${s.st}"><span class="d"></span>${STL[s.st]} · ${s.rd}%</span>
        <span class="minibar" style="margin-left:8px"><i style="width:${s.rd}%"></i></span></span>
      </div>`).join('')
    + `<div class="card-s card-new">+ New syllabus</div></div></div>`;
}

function vSchool(){
  const rows = SYL.filter(s => s.p === prog);
  const ok = rows.filter(s => s.st==='ok').length;
  return `<div class="block">
    ${progsel()}
    <div class="stats">
      <span class="stat"><span class="k">Syllabi</span><span class="v">${rows.length}</span></span>
      <span class="stat"><span class="k">Approved</span><span class="v">${ok}</span></span>
      <span class="stat"><span class="k">In progress</span><span class="v">${rows.filter(s=>s.st==='wip').length}</span></span>
      <span class="stat ${rows.filter(s=>s.st==='no').length?'bad':''}"><span class="k">Not started</span><span class="v">${rows.filter(s=>s.st==='no').length}</span></span>
    </div>
    <div class="sec-h">All syllabi</div>
    <p class="sec-note">Visible to everyone working with the cohort: who is writing what,
      where the document came from — an uploaded file or built from scratch — and when it was
      last touched.</p>
    <table class="tbl">
      <thead><tr><th style="width:28%">Course</th><th style="width:22%">Instructor</th>
        <th style="width:18%">Origin</th><th style="width:16%">State</th>
        <th style="width:10%">Readiness</th><th class="rt" style="width:6%">Updated</th></tr></thead>
      <tbody>` + rows.map(s => `<tr onclick="pickSyl('${esc(s.c)}','${s.p}')" style="cursor:pointer">
        <td><span class="nm">${esc(s.c)}</span></td>
        <td>${s.l ? esc(s.l) : '<span class="st no"><span class="d"></span>unassigned</span>'}</td>
        <td style="font-size:12.5px;color:var(--ink-3)">${SRC[s.src]}</td>
        <td><span class="st ${s.st}"><span class="d"></span>${STL[s.st]}</span></td>
        <td><span class="minibar"><i style="width:${s.rd}%"></i></span></td>
        <td class="rt" style="font-size:12.5px;color:var(--ink-3)">${s.up}</td></tr>`).join('')
    + `</tbody></table></div>`;
}

function cov(p,c,plo){ const m = D[p].cov[c]; return m && m[plo] ? m[plo] : 0 }
function ploSum(p,plo){ let s=0; for(const c of D[p].courses) s += cov(p,c.code,plo); return s }
function courseSum(p,c){ let s=0; for(const o of D[p].plo) s += cov(p,c,o.c); return s }

function vMatrix(){
  const d = D[prog];
  const unc = d.plo.filter(o => ploSum(prog,o.c)===0);
  const weak = d.courses.filter(c => c.type==='core' && courseSum(prog,c.code) < 1);
  let h = '<colgroup><col style="width:236px">'
        + d.courses.map(()=>'<col style="width:36px">').join('')
        + '<col style="width:48px"></colgroup><thead><tr><th class="rowh">Programme outcome</th>';
  for(const c of d.courses) h += `<th title="${esc(c.n)}">${c.code.replace('НД.','C').replace('ПР.','I').replace('АТ.','F').replace('ВД.','E')}</th>`;
  h += '<th>Σ</th></tr></thead><tbody>';
  for(const o of d.plo){
    const s = ploSum(prog,o.c);
    const code = o.c.replace('ПРН','PLO');
    h += `<tr class="${s===0?'bad':''}"><th title="${esc(code+' · '+o.t)}"><b>${code}</b>${esc(o.th)}</th>`;
    for(const c of d.courses){
      const v = cov(prog,c.code,o.c);
      const k = v===1?'c-full':(v?'c-part':'');
      const on = sel && sel.k==='mx' && sel.c===c.code && sel.p===o.c ? ' on' : '';
      h += `<td class="c ${k}${on}" onclick="pickCell('${c.code}','${o.c}')"><span></span></td>`;
    }
    h += `<td class="sum">${s===0?'0':String(s)}</td></tr>`;
  }
  h += '</tbody>';
  return `<div class="block">
    ${progsel()}
    <div class="stats">
      <span class="stat"><span class="k">Core courses</span><span class="v">${d.courses.filter(c=>c.type==='core').length}</span></span>
      <span class="stat"><span class="k">Programme outcomes</span><span class="v">${d.plo.length}</span></span>
      <span class="stat ${unc.length?'bad':''}"><span class="k">Outcomes with no cover</span><span class="v">${unc.length}</span></span>
      <span class="stat ${weak.length?'bad':''}"><span class="k">Core below the norm</span><span class="v">${weak.length}</span></span>
    </div>
    <div class="sec-h">PLO coverage</div>
    <p class="sec-note">A row is a programme learning outcome of this cohort. A column is a course.
      Cells are filled from the CLO → PLO matrix inside each syllabus, never by hand.
      Click a cell to see which course outcome covers it. Course codes follow the programme
      document: C core, E elective, I internship, F final project.</p>
    <div class="mx-scroll"><table class="mx">${h}</table></div>
    <div class="legend">
      <span class="key"><i class="sw full"></i> full cover</span>
      <span class="key"><i class="sw part"></i> partial, counts as 0.5</span>
      <span class="key"><i class="sw"></i> none</span>
    </div></div>`;
}

function vCourses(){
  return `<div class="block">
    <div class="sec-h">Courses &amp; cohorts</div>
    <p class="sec-note">The cohort a course belongs to is set by the manager or the Academic
      Director, not by the instructor. One course can run in several cohorts and be
      <b>core</b> in one and <b>elective</b> in another — Risk Management is core in MBA27
      and elective in MBA28. Click a row to change it.</p>
    <table class="tbl">
      <thead><tr><th style="width:36%">Course</th><th style="width:30%">Cohorts</th>
        <th style="width:34%">Instructor</th></tr></thead>
      <tbody>` + CRS.map((c,i) => `<tr onclick="pickCourse(${i})" style="cursor:pointer">
        <td><span class="nm">${esc(c.n)}</span></td>
        <td><span class="chips">${Object.keys(D).filter(s=>c.s[s]).map(s =>
            `<span class="chip ${c.s[s]==='elective'?'el':''}">${s}<i>${c.s[s]}</i></span>`).join('')}</span></td>
        <td>${c.l ? esc(c.l) : '<span class="st no"><span class="d"></span>unassigned</span>'}</td>
      </tr>`).join('') + `</tbody></table></div>`;
}

function vPol(){
  return `<div class="block">
    <div class="sec-h">Course policies</div>
    <p class="sec-note">Thirteen blocks. Three <b>locked</b> — the wording is identical in every
      syllabus. Ten <b>library</b> — the instructor picks a variant, and the pick is required:
      there is no default anywhere. ${ROLES[role].edit
        ? 'You can edit the wording — a change applies to every new syllabus.'
        : 'Editing is available to the Academic Director and the programme manager.'}</p>
    ` + POL.map((p,i) => `<div class="pol">
        <span class="n">${i+1}</span>
        <span class="b"><span class="t">${esc(p[0])}</span><span class="d">${esc(p[3])}</span></span>
        <span class="m"><span class="chip ${p[1]==='locked'?'el':''}">${p[1]}${p[2]?`<i>${p[2]} variants</i>`:''}</span></span>
      </div>`).join('') + `</div>`;
}

function vPlo(){
  const d = D[prog];
  return `<div class="block">
    ${progsel()}
    <div class="sec-h">Programme outcomes · ${prog}</div>
    <p class="sec-note">The list comes from the education programme of this cohort. The lists
      differ: MBA27 has 20 outcomes, MBA28 has 17. A syllabus is always checked against the list
      of its own cohort. Official wording is kept in Ukrainian, as approved.</p>
    ` + d.plo.map(o => `<div class="fld">
        <span class="l">${o.c.replace('ПРН','PLO')} · ${esc(o.th)}</span>
        <span class="v">${esc(o.t)}</span></div>`).join('') + `</div>`;
}

function vAccount(){
  const r = ROLES[role];
  return `<div class="block">
    <div class="prof">
      <span class="prof-av">${r.in}</span>
      <span><span class="prof-n">${esc(r.nm)}</span>
        <span class="prof-r">${esc(r.rl)}</span>
        <span class="prof-m">${esc(r.mail)}</span>
        <span class="row" style="margin-top:14px">
          <button class="btn btn-soft btn-s">Change photo</button>
          <button class="btn btn-ghost btn-s">Remove</button></span></span>
    </div>
    <div class="sec-h">Account settings</div>
    <p class="sec-note">Sign-in details and interface preferences.</p>
    <div class="fld"><span class="l">Full name</span><span class="v">${esc(r.nm)}
      <button class="btn btn-ghost btn-s" style="margin-left:10px">Edit</button></span></div>
    <div class="fld"><span class="l">Email</span><span class="v">${esc(r.mail)}
      <button class="btn btn-ghost btn-s" style="margin-left:10px">Change</button></span></div>
    <div class="fld"><span class="l">Password</span><span class="v">Last changed 14 Aug 2026
      <button class="btn btn-ghost btn-s" style="margin-left:10px">Change password</button></span></div>
    <div class="fld"><span class="l">Interface language</span><span class="v">English
      <button class="btn btn-ghost btn-s" style="margin-left:10px">Switch</button></span></div>
    <div class="fld"><span class="l">Theme</span><span class="v">Light
      <button class="btn btn-ghost btn-s" style="margin-left:10px" onclick="toggleTheme()">Switch</button></span></div>
    <div class="fld"><span class="l">Role</span><span class="v">${esc(r.rl)}
      <span class="src">set by an administrator</span></span></div>
    <div class="row"><button class="btn btn-fill btn-s">Save changes</button></div>
    </div>`;
}

/* ---------- права панель ---------- */
function pickCell(c,p){ sel = {k:'mx',c:c,p:p}; draw() }
function pickCourse(i){ sel = {k:'crs',i:i}; draw() }
function pickSyl(c,p){ sel = {k:'syl',c:c,p:p}; draw() }

function drawer(){
  if(!sel){
    if(vw==='matrix'){
      const unc = D[prog].plo.filter(o => ploSum(prog,o.c)===0);
      $('drLbl').textContent = 'No cover';
      $('dr').innerHTML = unc.length
        ? `<div class="dr-h">${unc.length} outcomes with no course</div>
           <div class="dr-sub">The programme promises a result that no syllabus in the cohort delivers.</div>`
          + unc.map(o => `<div class="dr-f"><div class="l">${o.c.replace('ПРН','PLO')} · ${esc(o.th)}</div>
              <div class="t">${esc(o.t)}</div></div>`).join('')
        : `<div class="dr-empty">Every outcome is covered.</div>`;
      return;
    }
    $('drLbl').textContent = 'Details';
    $('dr').innerHTML = `<div class="dr-empty">Pick a row or a cell to see the detail here.</div>`;
    return;
  }
  if(sel.k==='mx'){
    const d = D[prog];
    const course = d.courses.find(x => x.code===sel.c);
    const plo = d.plo.find(x => x.c===sel.p);
    const v = cov(prog,sel.c,sel.p);
    const det = DET[prog+'|'+sel.c+'|'+sel.p];
    $('drLbl').textContent = 'Cell';
    $('dr').innerHTML = `<div class="dr-h">${esc(course.n)}</div>
      <div class="dr-sub">${course.ects} ECTS · ${course.type}</div>
      <div class="dr-f"><div class="l">${plo.c.replace('ПРН','PLO')} · ${esc(plo.th)}</div><div class="t">${esc(plo.t)}</div></div>
      <div class="dr-f"><div class="l">Cover</div><div class="t">${
        v===1?'Full — the course directly builds this outcome.'
        :v?'Partial — the course touches the outcome without building it fully. Counts as 0.5.'
        :'None. This course does not claim this outcome.'}</div></div>`
      + (det ? `<div class="dr-f"><div class="l">Course outcome</div><div class="t">${esc(det[0])}</div></div>
               <div class="dr-f"><div class="l">Assessed by</div><div class="t">${esc(det[1])}</div></div>`
             : (v ? `<div class="dr-f"><div class="l">Course outcome</div>
                     <div class="t">Pulled from the CLO → PLO matrix of the syllabus.</div></div>` : ''))
      + `<div class="row"><button class="btn btn-fill btn-s">Open syllabus</button></div>`;
    return;
  }
  if(sel.k==='crs'){
    const c = CRS[sel.i];
    const n = Object.keys(D).filter(s => c.s[s]).length;
    $('drLbl').textContent = 'Course';
    $('dr').innerHTML = `<div class="dr-h">${esc(c.n)}</div>
      <div class="dr-sub">${n ? n+(n===1?' cohort':' cohorts') : 'no cohort assigned'} · ${c.l || 'no instructor'}</div>
      <div class="dr-f"><div class="l">Cohorts and type</div></div>`
      + Object.keys(D).map(s => {
          const on = !!c.s[s];
          return `<button class="pick ${on?'on':''}" onclick="toggleSet(${sel.i},'${s}')">
            <span class="bx"></span>
            <span class="pn">${s}<span class="pt">${D[s].label.split('· ')[1]}</span></span>
            ${on ? `<span class="chips" onclick="event.stopPropagation()">
              <span class="chip ${c.s[s]==='core'?'':'el'}" onclick="setType(${sel.i},'${s}','core')">core</span>
              <span class="chip ${c.s[s]==='elective'?'':'el'}" onclick="setType(${sel.i},'${s}','elective')">elective</span>
            </span>` : ''}</button>`;
        }).join('')
      + `<button class="pick" disabled><span class="bx"></span>
           <span class="pn">MMM28<span class="pt">arrives with the programme</span></span></button>
         <div class="dr-f"><div class="l">Why this matters</div><div class="t">
           The type sets the coverage norm: a core course has to cover at least one programme
           outcome of its cohort, an elective has no such norm. Cohorts have different outcome
           lists, so a syllabus belongs to a <b>course × cohort</b> pair: a course that runs in
           two cohorts has two syllabi.</div></div>`;
    return;
  }
  if(sel.k==='syl'){
    const s = SYL.find(x => x.c===sel.c && x.p===sel.p);
    $('drLbl').textContent = 'Syllabus';
    $('dr').innerHTML = `<div class="dr-h">${esc(s.c)}</div>
      <div class="dr-sub">${s.p} · ${s.l || 'no instructor'}</div>
      <div class="dr-f"><div class="l">State</div><div class="t">${STL[s.st]} · readiness ${s.rd}%</div></div>
      <div class="dr-f"><div class="l">Origin</div><div class="t">${SRC[s.src]}</div></div>
      <div class="dr-f"><div class="l">Last updated</div><div class="t">${s.up}</div></div>
      <div class="dr-f"><div class="l">Cohort</div><div class="t">${D[s.p].label}. The CLO → PLO
        matrix is checked against the outcome list of this cohort.</div></div>
      <div class="row"><button class="btn btn-fill btn-s">Open</button>
        ${s.own!==role && s.l ? '<button class="btn btn-ghost btn-s">Send a reminder</button>' : ''}</div>`;
  }
}

function toggleSet(i,s){ const c = CRS[i]; if(c.s[s]) delete c.s[s]; else c.s[s] = 'core'; draw() }
function setType(i,s,t){ CRS[i].s[s] = t; draw() }

/* ---------- підвал лівої панелі ---------- */
function foot(){
  if(vw==='mine' || vw==='account'){
    const mine = SYL.filter(s => s.own===role);
    const ok = mine.filter(s => s.st==='ok').length;
    const pct = mine.length ? Math.round(ok/mine.length*100) : 0;
    $('fl').textContent = 'My readiness'; $('fv').textContent = pct+'%';
    $('fb').style.width = pct+'%'; $('fs').textContent = `${ok} of ${mine.length} of my syllabi approved`;
  } else {
    const rows = SYL.filter(s => s.p===prog);
    const ok = rows.filter(s => s.st==='ok').length;
    const pct = rows.length ? Math.round(ok/rows.length*100) : 0;
    $('fl').textContent = prog; $('fv').textContent = pct+'%';
    $('fb').style.width = pct+'%'; $('fs').textContent = `${ok} of ${rows.length} syllabi approved`;
  }
}

function draw(){
  const r = ROLES[role];
  $('whoName').textContent = r.rl;
  $('av').textContent = r.in; $('mav').textContent = r.in;
  $('mnm').textContent = r.nm; $('mrl').textContent = r.rl;
  $('mcMine').textContent = SYL.filter(s => s.own===role).length;
  $('mcSchool').textContent = can('school') ? SYL.length : '—';
  $('heroK').textContent = VIEWS[vw][0];
  $('heroT').textContent = VIEWS[vw][1];
  const body = {mine:vMine, school:vSchool, matrix:vMatrix, courses:vCourses,
                pol:vPol, plo:vPlo, account:vAccount}[vw];
  $('main').innerHTML = body();
  $('drw').style.display = vw==='account' || vw==='pol' ? 'none' : '';
  nav(); roles(); foot(); drawer();
}
draw();
</script>
<script>
/* Перемикач теми. Значення живе лише в атрибуті data-theme на <html>,
   жодного сховища браузера — усі токени перевизначаються в CSS. */
function toggleTheme(){
  var r=document.documentElement;
  var n=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',n);
  var b=document.getElementById('themeBtn');
  if(b) b.textContent = n==='dark' ? '\u2600' : '\u263e';
}
</script>
</body>
</html>
