<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professor's Tutor — clickable walkthrough</title>
<style>
/* ============================================================
   KSE BUSINESS SCHOOL — Professor's Tutor
   Дизайн-токени з брендбука (жовтень 2026).

   Кольори     — палітра презентаційного брендбука
   Гарнітура   — Arial. Жодних вебшрифтів
   Радіуси     — 0. Бренд квадратний, і це його головна ознака
   Тіні        — немає. Площини розділяються лініями в 1px
   Елементи    — плашки: суцільні прямокутники, що стикуються
                 впритул і заходять одна на одну. Плюс крапковий
                 растр як тло. Це мова слайдів, перенесена в UI
   Критичне    — #62005F (вторинний колір бренда), бо червоного
                 в палітрі не існує

   Дві теми, один набір змінних:
     світла — біла шапка, зелений логотип
     темна  — майже чорна шапка (#111112 з брендбука), логотип білий
   ============================================================ */
:root{
  /* бренд */
  --brand:#004641;
  --brand-deep:#003632;
  --mint:#94D4C1;
  --green:#2EC195;
  --green-2:#60BE98;
  --plum:#62005F;

  /* шапка */
  --bar:#FFFFFF;
  --bar-fg:#111112;
  --bar-fg-2:#6B7280;
  --bar-line:rgba(17,17,18,.14);
  --bar-hover:#EDEFEE;
  --logo:#004641;

  /* площини */
  --bg:#EDEFEE;
  --paper:#FFFFFF;
  --soft:#E4E8E6;
  --band:#DFE8E4;
  --ink:#111112;
  --ink-2:#4B5554;
  --ink-3:#6B7280;
  --line:rgba(17,17,18,.13);
  --rule:#D2D8D6;
  --dot:rgba(0,70,65,.34);

  /* плашки */
  --plate:#94D4C1;
  --plate-fg:#06302A;

  /* ролі */
  --btn-bg:var(--brand); --btn-fg:#FFFFFF; --btn-hover:var(--brand-deep);
  --ok:var(--brand);
  --wip:var(--green-2);
  --flag:var(--plum);
  --flag-soft:rgba(98,0,95,.07);
  --ins:rgba(46,193,149,.32);
  --ins-0:rgba(46,193,149,.66);
  --me:var(--brand); --me-fg:#FFFFFF;

  /* геометрія */
  --r:0;
  --sh:inset 0 0 0 1px var(--line);
  --font:Arial,'Helvetica Neue',Helvetica,'Liberation Sans',sans-serif;
  --w-side:248px; --w-doc:560px; --w-doc-min:512px;
}

:root[data-theme="dark"]{
  --bar:#111112;
  --bar-fg:#FFFFFF;
  --bar-fg-2:rgba(255,255,255,.58);
  --bar-line:rgba(255,255,255,.14);
  --bar-hover:rgba(255,255,255,.1);
  --logo:#FFFFFF;

  --bg:#0B0B0C;
  --paper:#161618;
  --soft:#222225;
  --band:#13211E;
  --ink:#FFFFFF;
  --ink-2:#B6C1BE;
  --ink-3:rgba(255,255,255,.52);
  --line:rgba(255,255,255,.15);
  --rule:#000000;
  --dot:rgba(148,212,193,.32);

  --plate:#2EC195;
  --plate-fg:#06302A;

  --btn-bg:var(--green); --btn-fg:#06302A; --btn-hover:var(--green-2);
  --ok:var(--green);
  --wip:var(--mint);
  --flag:#D79BD4;                 /* освітлений #62005F: оригінал на
                                     темному не читається */
  --flag-soft:rgba(215,155,212,.1);
  --ins:rgba(46,193,149,.26);
  --ins-0:rgba(46,193,149,.5);
  --me:var(--brand); --me-fg:#FFFFFF;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ============ плашка ============================================
   Базовий елемент усієї системи. Прямокутник із заливкою, без
   радіуса. Дві плашки, поставлені впритул, — підпис і значення.
   ============================================================== */
.plate{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:5px 12px;font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
.plate-w{background:var(--paper);color:var(--ink);box-shadow:var(--sh);
  letter-spacing:0;text-transform:none}
.plates{display:flex;align-items:stretch}

/* крапковий растр — тло, не декор заради декору */
.raster{background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px}

/* ============ шапка ============================================
   Світла тема: біла, логотип зелений. Темна: майже чорна, логотип
   білий. Колір логотипа — currentColor, тому SVG один на обидві.
   ============================================================== */
.header{flex:0 0 auto;height:64px;display:flex;align-items:center;gap:22px;
  padding:0 18px;background:var(--bar);color:var(--bar-fg);
  border-bottom:1px solid var(--bar-line)}
.logo{flex:0 0 auto;display:block;width:182px;height:34px;color:var(--logo)}
.logo svg{display:block;width:182px;height:34px}
.hdots{flex:0 0 96px;height:24px;align-self:center;
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:9px 9px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 55%,transparent);opacity:.75}

.tabs{display:flex;gap:0;flex:1;min-width:0;overflow:hidden;align-items:center}
.tab{height:34px;padding:0 15px;border-radius:var(--r);font-size:13px;
  color:var(--bar-fg-2);display:flex;align-items:center;gap:9px;
  white-space:nowrap;transition:.13s}
.tab:hover{background:var(--bar-hover);color:var(--bar-fg)}
.tab.on{background:var(--plate);color:var(--plate-fg);font-weight:700}
.tdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.tdot.wip{background:var(--green)}
.tdot.ok{background:var(--brand)}
.tdot.new{background:var(--line)}
.tab.on .tdot{background:var(--plate-fg)}
.tab-add{height:34px;padding:0 13px;border-radius:var(--r);
  color:var(--bar-fg-2);font-size:13px}
.tab-add:hover{background:var(--bar-hover);color:var(--bar-fg)}

.who{flex:0 0 auto;display:flex;align-items:center;gap:0}
.who-name{font-size:13px;color:var(--bar-fg-2);padding-right:14px}
.who-av{width:34px;height:34px;border-radius:var(--r);background:var(--brand);
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
:root[data-theme="dark"] .who-av{background:var(--green);color:#06302A}
.theme{width:34px;height:34px;margin-left:10px;border-radius:var(--r);
  display:grid;place-items:center;font-size:14px;color:var(--bar-fg-2);
  box-shadow:inset 0 0 0 1px var(--bar-line)}
.theme:hover{background:var(--bar-hover);color:var(--bar-fg)}

/* ============ кнопки — ті самі плашки ========================== */
.btn{height:36px;padding:0 18px;border-radius:var(--r);font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:.13s;white-space:nowrap}
.btn-fill{background:var(--btn-bg);color:var(--btn-fg)}
.btn-fill:hover{background:var(--btn-hover)}
.btn-soft{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-3)}
.btn-soft:hover{background:var(--soft)}
.btn-ghost{color:var(--ink-2);font-weight:400}
.btn-ghost:hover{background:var(--soft)}
.btn:disabled{opacity:.32;cursor:default}
.btn-s{height:32px;padding:0 15px;font-size:12.5px}
.btn-w{width:100%}
.btn-lg{height:46px;padding:0 26px;font-size:14px}

/* ============ каркас ============================================ */
.body{flex:1;display:flex;gap:1px;background:var(--rule);min-height:0}
.card{background:var(--paper);display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* ---- зона 1 : структура силабуса ---- */
.side{width:var(--w-side);flex:0 0 var(--w-side);padding:0}
.side-list{flex:1;overflow-y:auto;padding:12px 0}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-radius:var(--r);text-align:left;transition:.13s;
  box-shadow:inset 3px 0 0 transparent}
.item:hover{background:var(--soft)}
.item.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--plate)}
.dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--ok)}
.dot.need{background:var(--flag)}
.dot.draft{background:var(--wip)}
.nm{flex:1;font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.item.on .nm{color:var(--ink);font-weight:700}

.side-foot{position:relative;flex:0 0 auto;padding:18px 16px 16px;
  border-top:1px solid var(--line);isolation:isolate}
.side-foot:before{content:'';position:absolute;inset:0;z-index:-1;
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 72%);
  mask-image:linear-gradient(180deg,#000,transparent 72%);opacity:.55}
.rd-top{display:flex;align-items:stretch;margin-bottom:10px}
.rd-l{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:5px 11px;font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase}
.rd-v{display:inline-flex;align-items:center;padding:5px 12px;font-size:15px;
  font-weight:700;box-shadow:var(--sh)}
.bar{height:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--btn-bg);width:0;
  transition:width .5s cubic-bezier(.32,.72,0,1)}
.rd-sub{font-size:12px;color:var(--ink-3);margin:10px 0 14px}

/* ---- зона 2 : чат ---- */
.chat{flex:1;min-width:400px;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;padding:30px 24px 4px}
.thread{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.turn{display:flex;flex-direction:column;gap:14px}
.turn.me{align-items:flex-end}
.said{font-size:14.5px;line-height:1.6;max-width:94%}
.said p+p{margin-top:12px}
.said b{font-weight:700}
.turn.me .said{background:var(--me);color:var(--me-fg);padding:11px 16px;
  font-size:14px;max-width:80%}
.quiet{color:var(--ink-2);font-size:13.5px}
.panel{background:var(--paper);box-shadow:var(--sh);padding:20px}
.p-lead{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.p-lead b{color:var(--ink);font-weight:700}

.opt{width:100%;display:flex;gap:12px;align-items:flex-start;padding:14px;
  border-radius:var(--r);text-align:left;transition:.13s;
  box-shadow:inset 0 0 0 1px transparent}
.opt:hover{background:var(--soft)}
.opt.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-theme="dark"] .opt.on{box-shadow:inset 0 0 0 2px var(--green)}
.ring{flex:0 0 auto;width:14px;height:14px;margin-top:4px;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px var(--ink-3)}   /* кругле навмисно:
     квадратна рамка читається як чекбокс, а вибір тут один */
.opt.on .ring{box-shadow:inset 0 0 0 5px var(--brand)}
:root[data-theme="dark"] .opt.on .ring{box-shadow:inset 0 0 0 5px var(--green)}
.o-t{display:block;font-size:13.5px;font-weight:700}
.o-q{display:block;font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:5px}
.o-note{display:inline-flex;align-items:center;margin-top:8px;background:var(--plate);
  color:var(--plate-fg);padding:3px 10px;font-size:11px;font-weight:700;
  letter-spacing:.06em}
.was{font-size:13.5px;color:var(--ink-3);text-decoration:line-through;
  text-decoration-color:var(--line);margin-bottom:10px}
.now{font-size:13.5px;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}
.why{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:14px}
.val{background:var(--ins);padding:1px 5px;font-weight:700;color:var(--ink)}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:.9}}

/* ---- порожній стан ---- */
.empty{position:relative;max-width:540px;margin:7vh auto 0;text-align:center;isolation:isolate}
.empty:before{content:'';position:absolute;z-index:-1;left:50%;top:-34px;
  width:420px;height:150px;transform:translateX(-50%);
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px;
  -webkit-mask-image:radial-gradient(60% 60% at 50% 42%,#000,transparent);
  mask-image:radial-gradient(60% 60% at 50% 42%,#000,transparent);opacity:.75}
.empty h2{font-size:28px;font-weight:400;letter-spacing:-.015em;margin-bottom:10px;line-height:1.2}
.empty p{color:var(--ink-2);font-size:14.5px;margin-bottom:28px}
.drop{background:var(--paper);box-shadow:var(--sh);padding:34px 26px;
  transition:.13s;cursor:pointer}
.drop:hover{box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-theme="dark"] .drop:hover{box-shadow:inset 0 0 0 2px var(--green)}
.drop-i{font-size:24px;margin-bottom:10px;opacity:.45}
.drop-t{font-size:14.5px;font-weight:700}
.drop-s{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.orr{display:flex;align-items:center;gap:14px;margin:20px 0;color:var(--ink-3);font-size:12px}
.orr:before,.orr:after{content:"";height:1px;background:var(--line);flex:1}
.howto{margin-top:28px;font-size:12.5px;color:var(--ink-3)}

/* ---- поле вводу ---- */
.compose{flex:0 0 auto;padding:14px 24px 10px}
.compose-in{max-width:620px;margin:0 auto;display:flex;gap:0;align-items:center;
  background:var(--paper);padding:0 0 0 18px;box-shadow:var(--sh);transition:.13s}
.compose-in.hot{box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-theme="dark"] .compose-in.hot{box-shadow:inset 0 0 0 2px var(--green)}
.compose-in input{flex:1;border:none;outline:none;font-size:14px;background:none;
  height:44px;color:var(--ink)}
.compose-in input::placeholder{color:var(--ink-3)}
.send{width:44px;height:44px;border-radius:var(--r);background:var(--btn-bg);
  color:var(--btn-fg);display:grid;place-items:center;flex:0 0 auto;font-size:15px}
.foot-hint{position:relative;max-width:620px;margin:10px auto 0;font-size:11.5px;
  color:var(--ink-3);text-align:center;isolation:isolate}
.foot-hint:before{content:'';position:absolute;z-index:-1;left:50%;top:-6px;
  width:300px;height:34px;transform:translateX(-50%);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);
  background-size:9px 9px;
  -webkit-mask-image:radial-gradient(60% 70% at 50% 50%,#000,transparent);
  mask-image:radial-gradient(60% 70% at 50% 50%,#000,transparent);opacity:.5}

/* ---- зона 3 : живий документ ---- */
.doc{width:var(--w-doc);flex:0 0 var(--w-doc);min-width:var(--w-doc-min)}
.doc-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 16px;height:50px;border-bottom:1px solid var(--line)}
.doc-lbl{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:5px 12px;font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase}
.doc-bar .seg{margin-left:auto}
.seg{display:flex;box-shadow:var(--sh)}
.seg button{padding:7px 15px;border-radius:var(--r);font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--plate);color:var(--plate-fg);font-weight:700}
.icob{width:34px;height:34px;border-radius:var(--r);color:var(--ink-2);
  display:grid;place-items:center;font-size:15px;box-shadow:var(--sh)}
.icob:hover{background:var(--soft)}
.paper{flex:1;overflow-y:auto;padding:0 34px 60px}
.doc-empty{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;color:var(--ink-3);gap:10px;padding:0 40px}
.doc-empty .big{font-size:28px;opacity:.3}

/* шапка документа: растрова смуга, на її нижній край сідають дві
   плашки впритул — підпис і назва. Пряма цитата зі слайдів */
.d-head{position:relative;height:92px;margin:0 -34px 40px;background:var(--band);
  background-image:radial-gradient(var(--dot) 1.15px,transparent 1.35px);
  background-size:10px 10px}
.d-plates{position:absolute;left:34px;bottom:-18px;display:flex;align-items:stretch;max-width:calc(100% - 68px)}
.d-kicker{display:inline-flex;align-items:center;background:var(--plate);
  color:var(--plate-fg);padding:10px 15px;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase}
.d-title{display:inline-flex;align-items:center;background:var(--paper);
  color:var(--ink);padding:10px 18px;font-size:18px;font-weight:700;
  letter-spacing:-.01em;box-shadow:var(--sh);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.d-sep{display:none}

.sec{scroll-margin-top:12px;padding:10px 12px;margin:0 -12px 12px;transition:background .45s}
.sec.flash{background:var(--soft)}
.h{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-2);
  margin-bottom:14px;letter-spacing:.11em;text-transform:uppercase;
  padding-bottom:6px;border-bottom:3px solid var(--plate)}
.p{font-size:13.5px;line-height:1.65;margin-bottom:10px}
.p.small{font-size:12.5px;color:var(--ink-2)}
.sub{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:18px 0 7px}
.ul{margin:0 0 8px 18px}
.ul li{font-size:13px;line-height:1.65;margin-bottom:2px}
.blank{display:block;padding:12px 14px;background:var(--soft);font-size:12.5px;color:var(--ink-3)}
.blank.need{background:var(--flag-soft);color:var(--flag);box-shadow:inset 3px 0 0 var(--flag)}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{text-align:left;font-weight:700;color:var(--ink-3);font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;padding:0 10px 8px 0}
table td{padding:9px 10px 9px 0;vertical-align:top;line-height:1.5;border-top:1px solid var(--line)}
table tr:first-child td{border-top:none}
.kv td:first-child{color:var(--ink-2);width:44%;font-size:12.5px}
.miss{color:var(--flag);font-weight:700}
.new{background:var(--ins);padding:1px 4px;animation:in .6s}
@keyframes in{from{background:var(--ins-0)}}
.tot{font-weight:700}
.bad{color:var(--flag)}

/* ---- фінальний екран ----
   Клас навмисно НЕ .done: .dot.done у лівій панелі має той самий
   суфікс, і правило ловило б статусні крапки. */
.finish{position:absolute;inset:0;background:var(--bg);opacity:.97;
  display:grid;place-items:center;z-index:40;padding:30px}
.finish-c{background:var(--paper);box-shadow:var(--sh);padding:40px;max-width:520px;text-align:center}
.finish-c h2{font-size:24px;font-weight:400;margin:16px 0 10px}
.finish-c p{color:var(--ink-2);font-size:14px}
.tick{width:52px;height:52px;background:var(--plate);color:var(--plate-fg);
  display:grid;place-items:center;font-size:24px;margin:0 auto}
.recv{text-align:left;margin:22px 0 4px;display:flex;flex-direction:column}
.recv div{font-size:13px;color:var(--ink-2);padding:9px 0;border-top:1px solid var(--line)}
.recv div b{color:var(--ink);font-weight:700}

/* ---- сповіщення ---- */
.toast{position:fixed;right:22px;bottom:78px;z-index:70;background:var(--brand);color:#fff;
  padding:0;display:flex;align-items:stretch;max-width:360px;
  opacity:0;transform:translateY(10px);transition:.26s cubic-bezier(.32,.72,0,1)}
.toast.in{opacity:1;transform:none}

<script>
/* ================= state ================= */
const S=[
 {id:'s0',n:'At a Glance',st:''},{id:'s1',n:'Summary',st:''},
 {id:'s2',n:'Instructor',st:''},{id:'s3',n:'Schedule',st:''},
 {id:'s4',n:'Assessment',st:''},{id:'s5',n:'Materials',st:''},
 {id:'s6',n:'Policies',st:''},{id:'s7',n:'Use of AI',st:''}];
let started=false, awaiting=null, sel=null, step=1;
const TOTAL=8;

const $=id=>document.getElementById(id);
function setStep(n){step=n;$('dstep').textContent=`Step ${n} of ${TOTAL}`}

/* ================= chrome ================= */
function tabs(){
  $('tabs').innerHTML = started
   ? `<button class="tab on"><span class="tdot wip"></span>Risk Management</button>
      <button class="tab"><span class="tdot ok"></span>Business Ethics</button>
      <button class="tab-add">+ New</button>`
   : `<button class="tab"><span class="tdot ok"></span>Business Ethics</button>
      <button class="tab on"><span class="tdot new"></span>New syllabus</button>`;
}
function draw(){
  $('list').innerHTML=S.map(s=>`<button class="item ${s.on?'on':''}" onclick="go('${s.id}')">
    <span class="dot ${s.st}"></span><span class="nm">${s.n}</span></button>`).join('');
  if(!started){$('rv').textContent='—';$('rb').style.width='0';$('rs').textContent='No document yet';
    $('dl').disabled=true;return}
  const d=S.filter(s=>s.st==='done').length,p=Math.round(d/S.length*100);
  $('rv').textContent=p+'%';$('rb').style.width=p+'%';
  $('rs').textContent = d===S.length ? 'Complete · all 8 sections approved' : `${d} of ${S.length} approved`;
  $('dl').disabled=false;
}
function set(id,st){S.find(x=>x.id===id).st=st;draw()}
function go(id){const e=$(id);if(!e)return;
  e.scrollIntoView({behavior:'smooth',block:'start'});
  e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1200);
  S.forEach(s=>s.on=false);const t=S.find(s=>s.id===id);if(t)t.on=true;draw()}

function turn(html,me){
  const d=document.createElement('div');d.className='turn'+(me?' me':'');d.innerHTML=html;
  $('thread').appendChild(d);
  setTimeout(()=>$('scroll').scrollTo({top:$('scroll').scrollHeight,behavior:'smooth'}),40);
  return d;
}
function think(fn,ms){
  const t=turn('<div class="typing"><i></i><i></i><i></i></div>');
  setTimeout(()=>{t.remove();fn()},ms||900);
}
